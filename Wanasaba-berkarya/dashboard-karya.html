<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karya saya · Wanasaba Berkarya</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{pine:'#2f5d43',ink:'#1f2a24',cream:'#f7f6f2',mist:'#ebeee8'},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style type="text/tailwindcss">.in{@apply w-full bg-white border border-black/15 rounded-md px-4 py-3 focus:outline-none focus:ring-2 focus:ring-pine}.btn{@apply bg-pine text-white font-medium rounded-md px-6 py-3}</style></head>
<body class="bg-cream text-ink font-sans"><div id="shell"></div>

    </div>
    <a href="tambah-karya.html" class="btn">Tambah karya +</a>
  </div>
  <div id="pesan" class="hidden"></div>

  <div class="flex flex-wrap items-center justify-between gap-4 mt-8">
    <div id="tab" class="flex gap-5 text-black/60"></div>
    <input id="cari" class="in max-w-xs" placeholder="Cari judul karya">
  </div>
  <div id="daftar" class="mt-4 bg-white border border-black/10 rounded-md divide-y divide-black/10"></div>
  <p class="mt-6 text-sm bg-mist rounded-md px-5 py-4">Hanya karya terbit yang tampil di profil publik. Draf tetap tersimpan di sini.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
